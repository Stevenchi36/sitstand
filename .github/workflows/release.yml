# Builds the installer and publishes a GitHub Release when a version tag is pushed:
#   git tag v0.1.3 && git push --tags
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        run: |
          # `cargo pkgid` ends in "#sitstand@0.1.2" (or "#0.1.2"); keep the version.
          $version = (cargo pkgid) -replace '.*[#@]', ''
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($version -ne $tag) {
            Write-Error "Tag v$tag doesn't match version $version in Cargo.toml"
            exit 1
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - run: cargo test

      # Same version as used locally. Downloads a prebuilt binary when it can.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      # Builds the release .exe and the NSIS installer (NSIS is downloaded by
      # cargo-packager itself).
      - run: cargo packager --release

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "target/release/sitstand_${env:VERSION}_x64-setup.exe" `
            --title "Sit-Stand Timer $env:VERSION" `
            --generate-notes
